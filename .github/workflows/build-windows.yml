name: Build Windows Installer

on:
  push:
    branches: [ "merge-main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: package-lock.json

    # build:all compiles the Rust xlsx-sidecar, so the runner needs cargo.
    # mirrors the Setup Rust step in ci.yml.
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache cargo (xlsx-sidecar)
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: apps/sheets/native/xlsx-engine

    - name: Install Dependencies
      run: npm ci

    # dist:win expects the xlsx sidecar at the MinGW/GNU target path, but on
    # Windows cargo builds to the MSVC target. Stage it by copying the MSVC
    # build over (see CONTRIBUTING.md "Building installers").
    - name: Build xlsx sidecar and stage at GNU target path
      shell: pwsh
      run: |
        npm run native:build -w @hermesoffice/sheets
        $gnuDir = "apps/sheets/native/xlsx-engine/target/x86_64-pc-windows-gnu/release"
        New-Item -ItemType Directory -Force -Path $gnuDir | Out-Null
        Copy-Item "apps/sheets/native/xlsx-engine/target/release/xlsx-sidecar.exe" "$gnuDir/xlsx-sidecar.exe" -Force

    - name: Build Windows Executable
      run: npm run dist:win

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HermesOffice-Windows-Installer
        path: apps/shell/release/*.exe
        retention-days: 7